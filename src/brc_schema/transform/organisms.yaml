# Curated organism names for the osti_to_brc transform.
#
# Keywords are resolved to BRC `species` entries in this order:
#   1. `ambiguous_names` below: emitted as a name only, never with an ID.
#   2. `organisms` below: emitted with the listed NCBI taxid.
#   3. An NCBI Taxonomy lookup through oaklib (OLS by default); see
#      brc_schema.util.taxonomy. One exact label or synonym match gives an ID;
#      several matches make the name ambiguous, so it is emitted without one.
#   4. A keyword shaped like "Genus epithet <more>" whose first two words are
#      a known taxon (e.g. "Zymomonas mobilis 2032") is emitted as a name
#      only. A known genus alone is not enough: "Sorghum genomics" is skipped.
# Anything else is treated as an ordinary keyword and not as an organism.
#
# Matching is exact after case folding and whitespace normalisation, so
# "corn stover" does not match "corn".
#
# This file overrides and backs up the lookup: it keeps common BRC names
# stable when OLS is unreachable and settles names that NCBI files under
# more than one taxon. Entries may be at any rank (a genus is fine).
#
# organisms fields:
#   scientific_name: current NCBI Taxonomy scientific name
#   ncbi_taxid:      NCBI Taxonomy ID (integer)
#   synonyms:        other names to match: former scientific names,
#                    abbreviations, and unambiguous common names
#
# Taxids verified against NCBI Taxonomy E-utilities on 2026-09-24.
#
# The feed_organisms block at the end of this file is generated from the live
# BRC data feeds by scripts/update_organisms_from_feeds.py. It adds names and
# synonyms but never overrides the curated entries here. Do not edit it by
# hand; correct names here and rerun the script.

# Names that do not identify a single taxon. They are kept as names, with no
# ID, unless the record also carries a taxon identifier.
ambiguous_names:
  - sorghum      # genus Sorghum (4557) or Sorghum bicolor (4558)
  - sugarcane    # usually a Saccharum hybrid, not S. officinarum

