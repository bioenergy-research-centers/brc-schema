# Curated organisms recognised in OSTI keywords by the osti_to_brc transform.
#
# A keyword becomes a BRC `species` entry only when it matches, in full,
# one of the names below (case-insensitive, whitespace-normalised). There is
# no partial or fuzzy matching, so "corn stover" does not match "corn".
#
# Every entry must be at species rank (or below) in NCBI Taxonomy. Names that
# denote a broader group are deliberately left out, even where BRC usage
# often implies one species:
#   - "poplar" names the genus Populus (NCBITaxon:3689)
#   - "Sorghum", "Arabidopsis", "Camelina", "Miscanthus" are genus names
#   - "sugarcane" is usually a Saccharum hybrid, not S. officinarum
#   - "yeast" is not a species
#
# Fields:
#   scientific_name: current NCBI Taxonomy scientific name
#   ncbi_taxid:      NCBI Taxonomy ID (integer)
#   synonyms:        other names to match: former scientific names,
#                    abbreviations, and unambiguous common names
#
# Verified against NCBI Taxonomy E-utilities on 2026-09-24.

organisms:
